[project]
name = "mudd"
version = "0.1.0"
description = "Multi User Dungeon (Discord)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "discord-py>=2.6.4",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=3.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "lefthook>=2.0.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-regressions[image]>=2.7.0",
    "ruff>=0.16.0",
    "squawk-cli>=2.36.0",
    "ty>=0.0.8",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_unit_test.py", "*_image_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "--cov=mudd --cov-report=term-missing:skip-covered --cov-report=xml"

[tool.coverage.run]
source = ["mudd"]
branch = true
omit = ["*_unit_test.py", "*_image_test.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ty.src]
exclude = [".claude/skills/skill-creator/", "vulture_whitelist.py"]

[tool.vulture]
paths = ["main.py", "mudd/", "scripts/", "tests/", "vulture_whitelist.py"]
min_confidence = 90
ignore_names = ["clean_user_state"]
exclude = ["*_unit_test.py", "*_image_test.py"]

[tool.ruff]
# Vendored skill scripts, not project code. Mirrors `[tool.ty.src] exclude`.
extend-exclude = [".claude/skills/skill-creator/"]
# lefthook passes staged files to ruff explicitly; without this, excludes are
# ignored for those paths and the hook would disagree with CI.
force-exclude = true

[tool.ruff.lint]
# `select` is intentionally unset so the project tracks ruff's default ruleset
# (413 rules as of v0.16.0). `extend-select` layers on the full categories we
# want beyond the curated defaults.
extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    "FA",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
