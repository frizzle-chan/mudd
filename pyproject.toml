[project]
name = "mudd"
version = "0.1.0"
description = "Multi User Dungeon (Discord)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "discord-py>=2.6.4",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.1",
    "rapidfuzz>=3.14.3",
]

[dependency-groups]
dev = [
    "lefthook>=2.0.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.14.10",
    "squawk-cli>=2.36.0",
    "ty>=0.0.8",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ty.src]
exclude = [".claude/skills/skill-creator/"]

[tool.vulture]
paths = ["main.py", "mudd/", "scripts/", "tests/"]
min_confidence = 90

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
